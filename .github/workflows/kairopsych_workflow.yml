۱. دکمه‌ها در نسخه‌ی جدید چطور کار می‌کنند؟
کانال اصلی سایکوپاد (bot.py): دکمه‌ی «پکیج‌ها و دوره‌ها» حذف نشد، بلکه در پست چهارشنبه به صورت چرخشی (هر هفته فقط ۱ دکمه) بین این ۳ گزینه می‌چرخد:

📋 مشاهده پکیج‌ها و دوره‌های خودشناسی

📊 انجام تست‌های شخصیت در سایت

💬 دریافت وقت مشاوره تخصصی(پست علمی دوشنبه، موزیک شبانه و پست‌های @psychopodai بدون دکمه‌ی شیشه‌ای منتشر می‌شوند و لینک مقاله‌ی علمی به صورت هایپرلینک آبی‌رنگ روی نام ژورنال در خط رفرنس قرار گرفته است).

کانال سایکوشات (psychoshot_bot.py): در کل روز فقط پست ۱۲:۳۰ ظهر دکمه‌ی تعاملی 🙋‍♂️ از من بپرس را دارد، و پست ساعت ۲۰:۳۰ شب در ۷۲٪ شب‌ها بدون دکمه است و در ۲۸٪ شب‌ها فقط ۱ دکمه‌ی چرخشی (یا 🎓 مشاهده دوره‌ها یا 💬 دریافت وقت مشاوره تخصصی) زیر آن قرار می‌گیرد.

کانال نیوز (news_bot.py): زیر هر پست به‌جای ۳ دکمه، فقط ۱ دکمه‌ی اختصاصیِ مرتبط با همان پست قرار گرفته است (شنبه: دوره‌ها و پکیج‌ها | دوشنبه: تست‌های شخصیت | چهارشنبه: ثبت‌نام دوره فعال | پنج‌شنبه: دریافت مشاوره و راهنمایی).

کانال‌های تخصصی (cbt_schema_bot.py): لینک مقاله داخل خط رفرنس قرار گرفته؛ ۶۰٪ پست‌ها بدون دکمه هستند و در ۴۰٪ پست‌ها فقط ۱ دکمه‌ی چرخشی (تست‌های سایت یا وقت مشاوره) نمایش داده می‌شود.

