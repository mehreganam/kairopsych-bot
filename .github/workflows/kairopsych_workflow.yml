name: KairoPsych Hourly Academic Translation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_kairopsych_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.ref_name }}"
          git checkout -f FETCH_HEAD

      - name: Run KairoPsych Bot
        env:
          KAIROPSYCH_BOT_TOKEN: ${{ secrets.KAIROPSYCH_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 kairopsych_bot.py

      - name: Save sent papers state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f kairopsych_state.json ]; then
            git add kairopsych_state.json
          fi
          git diff --staged --quiet || git commit -m "chore: update kairopsych state [skip ci]"
          git push origin HEAD:"${{ github.ref_name }}" || true
