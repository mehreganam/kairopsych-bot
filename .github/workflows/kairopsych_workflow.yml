بفرمایید در کدام کانال‌ها و زیر کدام پست‌ها می‌خواهید کلیدها را حذف یا به ۱ کلید کاهش دهیم تا همان را دقیق اعمال کنم؟

تعداد دکمه مشاهده پکیج ها و دوره های خودشناسی خیلی زیاده | ویترین دوره ها و پکیج ها - و اینکه زیرهبرخی پست ها ه تا دکمه هست هم خیلی جالب نیست پیشنهادت برایتعدیلش چیه که همه رو داشته باشیم اما نه با این فرم و تعداد و تکرار نمی خوام در تمام پست ها دکمه باشه لزوما

کاملاً موافقم؛ وقتی زیر هر پست ۲ یا ۳ دکمه‌ی شیشه‌ای (به‌ویژه دکمه‌ی تکراری «مشاهده دوره‌ها و پکیج‌ها») تکرار می‌شود، هم ظاهر کانال شلوغ و تبلیغاتی به نظر می‌رسد و هم مخاطب نسبت به دکمه‌ها «کوریِ بنری» (بی‌توجهی) پیدا می‌کند.

بهترین استراتژی، قانون «حداکثر ۱ دکمه، فقط در پستِ مرتبط (و بدون دکمه در بقیه پست‌ها)» است. به این شکل، نیمی از پست‌ها اصلاً دکمه ندارند و هر دکمه فقط هفته‌ای ۱ بار در جای واقعی خودش دیده می‌شود:

