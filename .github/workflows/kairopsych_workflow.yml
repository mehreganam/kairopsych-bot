محل قرارگیری فایل‌ها در گیت‌هاب:

فایل kairopsych_bot.py (موجود در پنل کد کنار صفحه) را در ریشه‌ی اصلی مخزن بگذارید.

فایل kairopsych_workflow.yml را در مسیر .github/workflows/kairopsych_workflow.yml قرار دهید.

تنظیم توکن در Secrets گیت‌هاب:

در بخش Settings -> Secrets and variables -> Actions، توکن ربات @kairopsych_bot را با نام KAIROPSYCH_BOT_TOKEN (و در صورتی که در یک مخزن کاملاً جدا برای دوستتان می‌گذارید، کلید GEMINI_API_KEY) ثبت کنید.

بهم از اول بگو در گیت هاب برای ثبت مجزای این پروژه کجا برم؟

برای اینکه پروژه‌ی دوستتان در یک مخزن (Repository) کاملاً جدا ثبت شود و هیچ ارتباطی با مخزن سایکوپاد نداشته باشد، این ۵ گام ساده را به ترتیب انجام دهید:

گام ۱: ساخت مخزن (Repository) جدید در گیت‌هاب
وارد سایت گیت‌هاب شوید و در بالاترین نوار صفحه (سمت راست)، روی علامت + کلیک کنید و گزینه‌ی New repository را بزنید.

در کادر Repository name یک نام (مثلاً kairopsych-bot) بنویسید.

وضعیت مخزن را روی Public بگذارید (تا اجرای ساعتی GitHub Actions کاملاً رایگان و نامحدود باشد).

تیک گزینه‌ی Add a README file را بزنید و در پایین صفحه دکمه‌ی سبز Create repository را کلیک کنید.

گام ۲: قرار دادن فایل اول (kairopsych_bot.py)
در صفحه‌ی مخزن جدیدی که ساخته شد، روی دکمه‌ی Add file و سپس Create new file کلیک کنید.

در کادر بالای صفحه (Name your file...) بنویسید:
kairopsych_bot.py

کد کامل kairopsych_bot.py را از پنل کنار همین صفحه کپی کنید و در کادر بزرگ وسط صفحه Paste کنید.

دکمه‌ی سبز Commit changes... (بالا سمت راست) را بزنید و در پنجره‌ی بازشده دوباره Commit changes را کلیک کنید.

گام ۳: قرار دادن فایل دوم (زمان‌بندی ساعتی)
دوباره در صفحه‌ی اصلی مخزن جدید، روی دکمه‌ی Add file و سپس Create new file کلیک کنید.

در کادر نام فایل، دقیقاً این عبارت را (با نقطه‌ی اول و اسلش‌ها) تایپ کنید تا پوشه‌ها خودکار ساخته شوند:
.github/workflows/kairopsych_workflow.yml

محتوای فایل kairopsych_workflow.yml را داخل کادر بزرگ Paste کنید و دکمه‌ی سبز Commit changes را بزنید.

گام ۴: ثبت توکن ربات و کلید جمینای (Secrets)
در نوار بالای همین مخزن جدید، روی تب Settings (آیکون چرخ‌دنده) کلیک کنید.

از منوی سمت چپ، به بخش Secrets and variables بروید و زیرمنوی Actions را باز کنید.

روی دکمه‌ی سبز New repository secret کلیک کنید و این ۲ کلید را یکی‌یکی بسازید:

کلید اول:

در کادر Name بنویسید: KAIROPSYCH_BOT_TOKEN

در کادر Secret: توکن ربات @kairopsych_bot (که از BotFather گرفته‌اید) را وارد کنید و Add secret را بزنید.

کلید دوم:

دوباره New repository secret را بزنید، در کادر Name بنویسید: GEMINI_API_KEY

در کادر Secret: کلید API جمینای را وارد کنید و Add secret را بزنید.

گام ۵: تست فوری با یک کلیک
مطمئن شوید ربات @kairopsych_bot در کانال @kairopsychbackup به عنوان Admin (با دسترسی ارسال پست) اضافه شده است.

در بالای مخزن گیت‌هاب روی تب Actions کلیک کنید.

از سمت چپ روی KairoPsych Hourly Academic Translation کلیک کنید، در سمت راست دکمه‌ی Run workflow و سپس دکمه‌ی سبز Run workflow را بزنید تا اولین مقاله‌ی ترجمه‌شده همین الان در کانال @kairopsychbackup منتشر شود (و از آن به بعد، هر ۱ ساعت یک بار خودکار اجرا خواهد شد).





Gemini is AI and can make mistakes.


Complete
name: KairoPsych Hourly Academic Translation (@kairopsychbackup)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # اجرای خودکار ساعتی یک بار (در دقیقه ۰ هر ساعت شبانه‌روز) برای ارسال مقالات ترجمه‌شده در @kairopsychbackup
    - cron: '0 * * * *'

  workflow_dispatch: # امکان اجرای دستی فوری با یک کلیک برای تست

permissions:
  contents: write

jobs:
  run_kairopsych_bot:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدهای مخزن (بدون وابستگی به Node.js 20)
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.ref_name }}"
          git checkout -f FETCH_HEAD

      - name: اجرای ربات مستقل ترجمه مقالات (@kairopsych_bot)
        env:
          KAIROPSYCH_BOT_TOKEN: ${{ secrets.KAIROPSYCH_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 kairopsych_bot.py

      - name: ذخیره خودکار لیست مقالات ارسال‌شده برای جلوگیری از تکرار
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f kairopsych_state.json ]; then
            git add kairopsych_state.json
          fi
          git diff --staged --quiet || git commit -m "chore: update kairopsych sent papers state [skip ci]"
          git push origin HEAD:"${{ github.ref_name }}" || true
