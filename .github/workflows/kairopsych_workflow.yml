نتیجه این تغییر در یک نگاه:
هیچ پستی در هیچ کانالی ۲ یا ۳ دکمه نخواهد داشت (همیشه یا ۰ دکمه یا فقط ۱ دکمه).

دکمه‌ی «مشاهده دوره‌ها» از کانال اصلی، کانال AI، موزیک شبانه و سایکوشات کاملاً حذف می‌شود و فقط در کانال خودش (@psychopodnews) می‌آید.

تمام مقاصد شما (سایت، تست‌های شخصیت، مشاوره، ژورنال علمی و از من بپرس) بدون هیچ حذفی، به صورت هوشمند در طول هفته پخش می‌شوند.

اگر این چیدمان با سلیقه‌تان هماهنگ است تایید بفرمایید تا همین الان روی هر ۴ فایل (bot.py، news_bot.py، cbt_schema_bot.py و psychoshot_bot.py) اعمالش کنم.

